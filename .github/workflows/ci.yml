name: CI

on: [push]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Lock files match pyproject.toml
        run: |
          python -m pip install uv==0.13.5
          check="$RUNNER_TEMP/lock"
          mkdir -p "$check"
          cp pyproject.toml requirements.lock requirements-dev.lock "$check/"
          cd "$check"
          uv pip compile pyproject.toml --universal --python-version 3.12 --generate-hashes -o requirements.lock -q
          uv pip compile pyproject.toml --extra dev --constraint requirements.lock --universal --python-version 3.12 \
            --generate-hashes -o requirements-dev.lock -q
          diff -u "$GITHUB_WORKSPACE/backend/requirements.lock" requirements.lock
          diff -u "$GITHUB_WORKSPACE/backend/requirements-dev.lock" requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Audit
        run: npm audit --audit-level=high
