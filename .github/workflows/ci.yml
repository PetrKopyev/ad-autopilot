name: Backend CI

on: [push]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
