x-backend: &backend
  image: ad-autopilot-backend:local
  build:
    context: ../backend
  env_file:
    - ${BACKEND_ENV_FILE:-../.env}
  environment:
    MEDIA_DIR: /data/media
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Адрес клиента берётся из X-Forwarded-For только от Caddy: по нему работают лимиты входа и запросов.
    command:
      [
        "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
        "--proxy-headers", "--forwarded-allow-ips", "${CADDY_IP:-172.31.250.10}",
      ]

  worker:
    <<: *backend
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker.main"]

  caddy:
    image: caddy:2
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
    # Демо слушает только 127.0.0.1 (BIND_ADDR в .env.demo), сервер — все адреса.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:80:80"
      - "${BIND_ADDR:-0.0.0.0}:443:443"
    networks:
      default:
        ipv4_address: ${CADDY_IP:-172.31.250.10}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ../frontend/dist
        target: /srv/web
        read_only: true
        bind:
          create_host_path: true
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.31.250.0/24}

volumes:
  media:
  postgres_data:
  caddy_data:
  caddy_config:
